{{- if .Values.redisPersistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cloudicraft.fullname" . }}-redis-pvc
  labels:
    {{- include "cloudicraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - {{ .Values.redisPersistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.redisPersistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudicraft.fullname" . }}-redis
  labels:
    {{- include "cloudicraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: {{ .Values.replicaCount.redis }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cloudicraft.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cloudicraft.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.image.redis.repository }}:{{ .Values.image.redis.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            {{- toYaml .Values.resources.redis | nindent 12 }}
          {{- if .Values.redisPersistence.enabled }}
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          {{- end }}
      {{- if .Values.redisPersistence.enabled }}
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: {{ include "cloudicraft.fullname" . }}-redis-pvc
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudicraft.fullname" . }}-redis
  labels:
    {{- include "cloudicraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: {{ .Values.service.redis.type }}
  ports:
    - port: {{ .Values.service.redis.port }}
      targetPort: redis
      name: redis
  selector:
    app.kubernetes.io/name: {{ include "cloudicraft.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
