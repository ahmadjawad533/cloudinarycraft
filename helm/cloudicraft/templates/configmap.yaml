apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudicraft.fullname" . }}-config
  labels:
    {{- include "cloudicraft.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.port | quote }}
  REDIS_HOST: {{ include "cloudicraft.fullname" . }}-redis
  REDIS_PORT: {{ .Values.service.redis.port | quote }}
  CLOUDINARY_CLOUD_NAME: {{ .Values.config.cloudinaryCloudName | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudicraft.fullname" . }}-secrets
  labels:
    {{- include "cloudicraft.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLOUDINARY_API_KEY: {{ .Values.secrets.cloudinaryApiKey | quote }}
  CLOUDINARY_API_SECRET: {{ .Values.secrets.cloudinaryApiSecret | quote }}
---
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloudicraft.serviceAccountName" . }}
  labels:
    {{- include "cloudicraft.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
