apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: cloudicraft-studio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow DNS egress to kube-system CoreDNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: cloudicraft-studio
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow Ingress Controller to route traffic to Frontend and Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-apps
  namespace: cloudicraft-studio
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: ["cloudicraft-frontend", "cloudicraft-backend"] }
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 5001
---
# Allow Backend to communicate with Redis and Cloudinary CDN/API (Port 443)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: cloudicraft-studio
spec:
  podSelector:
    matchLabels:
      app: cloudicraft-backend
  policyTypes:
    - Egress
  egress:
    # Allow to Redis
    - to:
        - podSelector:
            matchLabels:
              app: cloudicraft-redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow external HTTPS for Cloudinary API
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# Allow Redis to receive connections ONLY from Backend pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress-policy
  namespace: cloudicraft-studio
spec:
  podSelector:
    matchLabels:
      app: cloudicraft-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudicraft-backend
      ports:
        - protocol: TCP
          port: 6379
