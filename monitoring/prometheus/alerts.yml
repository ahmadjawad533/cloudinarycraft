groups:
  - name: cloudicraft_alerts
    rules:
      - alert: BackendServiceDown
        expr: up{job="cloudicraft-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CloudiCraft backend instance is down"
          description: "Backend target {{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: HighHttp5xxErrorRate
        expr: sum(rate(cloudicraft_http_request_duration_seconds_count{code=~"5.."}[5m])) / sum(rate(cloudicraft_http_request_duration_seconds_count[5m])) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate detected"
          description: "More than 5% of HTTP requests returned 5xx status codes over the last 5 minutes."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(cloudicraft_http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "P95 request latency exceeds 1.5 seconds"
          description: "95th percentile latency is {{ $value }}s for the backend service."

      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) > 400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node.js process memory exceeds 400MB"
          description: "Resident set memory is {{ $value }}MB on {{ $labels.instance }}."
