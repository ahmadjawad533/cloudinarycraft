name: Continuous Deployment (GitOps)

on:
  workflow_run:
    workflows: [ "Build & Publish Container Images" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy to Kubernetes (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Dry Run Helm Deployment
        run: |
          echo "Validating Helm chart templates..."
          helm template cloudicraft ./helm/cloudicraft \
            --set image.tag=${{ github.sha }} \
            --namespace cloudicraft-studio

      - name: Simulate Cluster Rollout and Health Check
        run: |
          echo "Simulating zero-downtime deployment rollout..."
          echo "Target namespace: cloudicraft-studio"
          echo "Image tag: ${{ github.sha }}"
          echo "Verification probe: GET /healthz"
          echo "Rollout validation succeeded."
